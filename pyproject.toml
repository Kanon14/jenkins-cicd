[project]
name = "jenkins-cicd"
version = "0.1.0"
description = "Jenkins CI/CD learning lab"
readme = "README.md"
authors = [
    { name = "Kanon14" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.2",
    "httpx2==2.15.0",
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[project.scripts]
jenkins-cicd = "jenkins_cicd:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
